<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orviko - Menunggu Pembayaran</title>
  <link rel="stylesheet" href="/src/checkout.css" />
</head>
<body data-page="payment-status" data-status-tone="pending">
  <main class="status-page">
    <section class="status-shell">
      <a class="brand status-brand" href="/">
        <img class="brand-mark" src="/assets/Logo-2.png" alt="Orviko logo" />
        <span class="brand-name">Orviko</span>
      </a>
      <p class="eyebrow">Menunggu Pembayaran</p>
      <h1>Transaksi kamu masih menunggu penyelesaian.</h1>
      <p id="statusBody">Kamu bisa menyelesaikan pembayaran dari channel yang dipilih.</p>
      <dl class="payment-details" id="paymentDetails"></dl>
      <a class="status-cta" href="/pricing.html">Kembali ke paket</a>
    </section>
  </main>
  <script type="module" src="/src/checkout.js"></script>
</body>
</html>
