services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
