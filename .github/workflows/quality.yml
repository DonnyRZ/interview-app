name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orviko_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orviko_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/orviko_ci
      SESSION_SECRET: ci-session-secret-longer-than-sixteen-characters
      FRONTEND_BASE_URL: http://127.0.0.1:5174
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174
      OPENAI_API_KEY: ci-not-a-real-key
      OPERATIONS_TOKEN: ci-operations-token-longer-than-twenty-four
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm --workspace @interview-app/api run test:phase7
      - run: npm --workspace @interview-app/api run test:auth-payment
      - run: npm --workspace @interview-app/api run test:cost-safety
      - run: npm --workspace @interview-app/api run test:privacy
      - run: npm run build
