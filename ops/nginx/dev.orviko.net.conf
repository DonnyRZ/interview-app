server {
  listen 80;
  listen [::]:80;
  server_name dev.orviko.net;

  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name dev.orviko.net;

  ssl_certificate /etc/letsencrypt/live/dev.orviko.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.orviko.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /srv/orviko/dev/app/apps/web/dist;
  index index.html;
  client_max_body_size 10m;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.openai.com wss://api.openai.com; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

  location = /app {
    return 308 /app/;
  }

  location ^~ /app/assets/ {
    alias /srv/orviko/dev/app/apps/web-app/dist/assets/;
    access_log off;
    expires 1y;
  }

  location ^~ /app/audio/ {
    alias /srv/orviko/dev/app/apps/web-app/dist/audio/;
    access_log off;
    expires 1d;
  }

  location ^~ /app/ {
    alias /srv/orviko/dev/app/apps/web-app/dist/;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.openai.com wss://api.openai.com; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    try_files $uri $uri/ /app/index.html;
  }

  location ~ ^/(auth|account|payments|profile-documents|meeting-contexts|live-meetings)(/|$) {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
